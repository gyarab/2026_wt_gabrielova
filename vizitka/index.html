<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vizitka</title>
    <style>
        body {
            background-color: rgb(250, 255, 154);
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 0;
        }
        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vizitka {
            background-color: rgb(158, 254, 185);
            width: 300px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
        ul {
            text-align: left;
        }
        .profile-img {
            width: 150px;
            vertical-align: middle;
        }
        button {
            padding: 20px 40px;
            color: azure;
            border-radius: 5px;
            border: 0;
            background: linear-gradient(45deg, rgb(225, 255, 0), rgb(0, 255, 0));
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="vizitka">
            <h1>
                <img src="./profilovka.jpg" alt="Halina Pawlowska" class="profile-img"><br> Halina Pawlowská
            </h1>
            <p>Česká spisovatelka a scénáristka. <br><br>
            Co má Halina ráda:
            </p>
            <ul>
                <li>Kočičí steaky</li>
                <li>Psí řízky</li>
                <li>Slivovici</li>
            </ul>

            <button onclick='alert("Tlačítko funguje")'>Recepty</button>
        </div>
    </div>

</body>
</html>
